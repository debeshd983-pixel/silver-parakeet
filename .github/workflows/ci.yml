name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint + tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the version the project is validated against (and the Docker base).
        # Add more versions here once verified; requires-python allows >=3.9,<3.14.
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build and dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Check the checkpoint is committed and under GitHub's file limit
        # tests/test_classifier.py skips without weights, so a missing checkpoint would
        # otherwise make the suite silently weaker rather than fail.
        #
        # GitHub hard-blocks files >= 100 MiB. The INT8 checkpoint is ~91.8 MiB, leaving
        # only ~8 MiB of margin - a larger checkpoint would be rejected at commit time
        # with an opaque error. Fail here with a clear message instead, and see the
        # remediation note in README ("Checkpoint size").
        run: |
          CKPT=sahu65/models/classifier.int8.onnx
          if [ ! -f "$CKPT" ]; then
            echo "::error::$CKPT is missing from the repo"
            exit 1
          fi
          SIZE=$(stat -c%s "$CKPT")
          LIMIT=$((100 * 1024 * 1024))
          echo "checkpoint: $SIZE bytes ($((SIZE / 1024 / 1024)) MiB), GitHub limit 100 MiB"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::checkpoint exceeds GitHub's 100 MiB per-file limit."
            echo "::error::Remediation: store it as a GitHub Release asset and download it"
            echo "::error::in scripts/fetch_models.py, or enable Git LFS for *.onnx."
            exit 1
          fi
          ls -la sahu65/models/

      - name: Lint (ruff)
        run: python -m ruff check sahu65 tests scripts

      - name: Test (pytest)
        # Models load in the background (~10s ONNX init); the suite polls /readyz.
        run: python -m pytest -q

  build:
    name: build + verify distributions
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build
        run: python -m build

      - name: Verify distribution contents and sizes
        # Guards against PyPI's 100 MiB limit and against a model-less wheel.
        run: python scripts/verify_dist.py

      - name: twine check
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error