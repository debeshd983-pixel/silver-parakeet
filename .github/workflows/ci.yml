name: CI

# Single pipeline: verify -> build -> publish.
#
#   * Every push to main/master and every PR runs lint, tests, checkpoint guard,
#     build, verify_dist.py, twine check and a smoke test of the built wheel.
#   * Pushes to main/master then continue to the publish job, which uploads the
#     *exact artifacts that were just verified* to PyPI and polls until the built
#     version is live. Pull requests never publish.
#
# PyPI releases are immutable, so the upload uses skip-existing: true - a push that
# did not bump the version is a green no-op on PyPI. To actually ship a change,
# bump the version first and push that:
#
#     python scripts/bump_version.py patch     # or minor / major / X.Y.Z
#     git add -A && git commit -m "sahu65 1.0.1" && git push
#
# Requires a secret named exactly PYPI_API_TOKEN (repository secret, or an
# environment secret on the `pypi` environment - environment secrets override
# repository ones):  https://pypi.org/manage/account/token/
# For the FIRST upload the project does not exist on PyPI yet, so the token must be
# scoped to the whole account; re-scope it to the `sahu65` project afterwards.

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint + tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the version the project is validated against (and the Docker base).
        # Add more versions here once verified; requires-python allows >=3.9,<3.14.
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build and dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Check the encoder is committed and under GitHub's file limit
        # tests/test_clip_probe.py skips without weights, so a missing encoder would
        # otherwise make the suite silently weaker rather than fail.
        #
        # GitHub hard-blocks files >= 100 MiB. The INT8 CLIP encoder is ~85.5 MiB, leaving
        # ~14 MiB of margin - a larger encoder would be rejected at commit time with an
        # opaque error. Fail here with a clear message instead, and see the remediation
        # note in README ("Publishing to PyPI").
        run: |
          CKPT=sahu65/models/clip_encoder.int8.onnx
          HEAD=sahu65/models/clip_head.json
          if [ ! -f "$CKPT" ]; then
            echo "::error::$CKPT is missing from the repo"
            exit 1
          fi
          if [ ! -f "$HEAD" ]; then
            echo "::error::$HEAD is missing from the repo (the fitted probe head)"
            exit 1
          fi
          SIZE=$(stat -c%s "$CKPT")
          LIMIT=$((100 * 1024 * 1024))
          echo "encoder: $SIZE bytes ($((SIZE / 1024 / 1024)) MiB), GitHub limit 100 MiB"
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::encoder exceeds GitHub's 100 MiB per-file limit."
            echo "::error::Remediation: store it as a GitHub Release asset and download it"
            echo "::error::in scripts/build_dynamic_clip.py, or enable Git LFS for *.onnx."
            exit 1
          fi
          ls -la sahu65/models/

      - name: Lint (ruff)
        run: python -m ruff check sahu65 tests scripts

      - name: Test (pytest)
        # Models load in the background (~10s ONNX init); the suite polls /readyz.
        run: python -m pytest -q

  build:
    name: build + verify distributions
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build
        run: python -m build

      - name: Verify distribution contents and sizes
        # Guards against PyPI's 100 MiB limit and against a model-less wheel.
        run: python scripts/verify_dist.py

      - name: twine check
        run: python -m twine check dist/*

      - name: Smoke-test the built wheel in a clean environment
        # Prove the artifact a user will actually install can load the model and
        # produce a verdict, before it goes anywhere near PyPI.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import sahu65, io
          from PIL import Image
          info = sahu65.model_info()
          assert info["loaded"], info
          # The detector is a linear probe on frozen CLIP: it emits 512-d embeddings and
          # carries no class labels of its own, so the head/encoder agreement is what
          # has to hold here.
          assert info["embed_dim"] == 512, info
          assert "higher" in info["head_direction"], info
          buf = io.BytesIO()
          Image.new("RGB", (320, 320), "white").save(buf, format="JPEG")
          r = sahu65.detect_bytes(buf.getvalue())
          assert r.verdict in ("likely_ai", "likely_real", "inconclusive"), r
          # Thresholds are fitted, so this must NOT be flagged unfitted.
          assert r.calibrated, "thresholds.json is not fitted"
          assert "thresholds_unfitted" not in r.warnings, r.warnings
          print("smoke test OK:", sahu65.__version__, r.verdict, r.ai_probability)
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    # Publishes on every push to main/master and on manual runs checked out from
    # those branches. Pull requests (and dispatches from feature branches) skip it.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    # Requires an environment (Settings -> Environments -> pypi). Protection rules let
    # you require review before the upload - if a run sits waiting, approve it there.
    environment:
      name: pypi
      url: https://pypi.org/project/sahu65/

    permissions:
      contents: read

    steps:
      - name: Check PYPI_API_TOKEN is configured
        # Fail with an actionable message instead of an opaque 401 from PyPI.
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::error::PYPI_API_TOKEN is missing or empty."
            echo "::error::Add it under Settings -> Secrets and variables -> Actions,"
            echo "::error::or on the 'pypi' environment (an environment secret with the"
            echo "::error::same name overrides the repository secret)."
            exit 1
          fi
          echo "PYPI_API_TOKEN is set (${#PYPI_API_TOKEN} chars)"

      - name: Download the verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Show what will be uploaded
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # PyPI releases are immutable: on a push that did not bump the version the
          # files already exist and the upload is skipped instead of failing, which is
          # what makes "publish on every push" safe. Remove this line if you would
          # rather a duplicate version be a hard failure.
          skip-existing: true
          # Attestations require Trusted Publishing (OIDC); we authenticate with a
          # token, so there is nothing to attest with.
          attestations: false

      - name: Confirm the built version is visible on PyPI
        run: |
          VERSION=$(basename "$(ls dist/*.whl | head -n 1)" | cut -d- -f2)
          echo "expecting sahu65==$VERSION on PyPI"
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/sahu65/$VERSION/json" > /dev/null; then
              echo "sahu65 $VERSION is live on PyPI"
              exit 0
            fi
            echo "waiting for PyPI to index (attempt $i/30)..."
            sleep 10
          done
          echo "::warning::sahu65 $VERSION did not appear on PyPI within 5 minutes; check manually"