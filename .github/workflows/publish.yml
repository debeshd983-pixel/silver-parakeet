name: Publish to PyPI

# Triggers:
#   - publishing a GitHub Release (recommended), or
#   - manual dispatch (set the version input to cut a release by hand).
#
# Requires a repository secret:
#   PYPI_API_TOKEN  ->  https://pypi.org/manage/account/token/
#                       scope: "sahu65" project only. NOT your account password.
#
# NOTE ON SUPPLY CHAIN: the actions below are referenced by version tag, not by commit
# SHA. Pinning to a SHA is stronger and is recommended before you rely on this for real
# releases: `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` to resolve the SHA, then
# replace `@v4` with `@<sha>`.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm an upload to PyPI'
        required: true
        default: ""

jobs:
  publish:
    name: build + publish
    runs-on: ubuntu-latest

    # Requires an environment (Settings -> Environments -> pypi). Protection rules let
    # you require review before the upload runs.
    environment:
      name: pypi
      url: https://pypi.org/project/sahu65/

    permissions:
      contents: read

    steps:
      - name: Confirm manual publish
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "publish" ]; then
            echo "::error::confirmation text did not match 'publish'"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Check the checkpoint is committed
        run: |
          if [ ! -f sahu65/models/classifier.int8.onnx ]; then
            echo "::error::sahu65/models/classifier.int8.onnx is missing from the repo"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Verify distribution contents and sizes
        # Fails here rather than letting PyPI reject a >100 MiB or model-less artifact.
        run: python scripts/verify_dist.py

      - name: twine check
        run: python -m twine check dist/*

      - name: Smoke-test the built wheel in a clean environment
        # Prove the artifact a user will actually install can load the model and
        # produce a verdict, before it goes out.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import sahu65, io
          from PIL import Image
          info = sahu65.model_info()
          assert info["loaded"], info
          assert info["ai_class_index"] == 0, info
          assert info["labels"]["0"] == "artificial", info
          buf = io.BytesIO()
          Image.new("RGB", (320, 320), "white").save(buf, format="JPEG")
          r = sahu65.detect_bytes(buf.getvalue())
          assert r.verdict in ("likely_ai", "likely_real", "inconclusive"), r
          print("smoke test OK:", r.verdict, r.ai_probability)
          PY

      - name: Show what will be uploaded
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Keeps a re-run of a failed job from erroring on files already uploaded.
          # Remove this line if you would rather a duplicate upload be a hard failure.
          skip-existing: true

      - name: Confirm the release is visible on PyPI
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://pypi.org/pypi/sahu65/json > /dev/null; then
              echo "sahu65 is live on PyPI"
              curl -fsS https://pypi.org/pypi/sahu65/json | python -c \
                "import json,sys; print('latest:', json.load(sys.stdin)['info']['version'])"
              exit 0
            fi
            echo "waiting for PyPI to index (attempt $i/30)..."
            sleep 10
          done
          echo "::warning::sahu65 did not appear on PyPI within 5 minutes; check manually"